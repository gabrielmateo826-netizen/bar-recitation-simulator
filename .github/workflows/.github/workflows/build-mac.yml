name: Build macOS DMG

on:
  workflow_dispatch: # Allows manual 1-click trigger from GitHub web UI
  push:
    branches: [main, master]

jobs:
  build-mac:
    runs-on: macos-14 # Apple Silicon (M1/M2/M3/M4) runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri macOS App (Universal DMG)
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Upload macOS Installer (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: BarRecitationSimulator-macOS-Universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error