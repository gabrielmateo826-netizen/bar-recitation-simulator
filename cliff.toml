[changelog]
header = """
# Philippine Bar Recitation Simulator Suite: Master Technical Evolution & Changelog

This document chronicles the complete development history, architectural decisions, bug fixes, storage migrations, and feature milestones of the Philippine Bar Recitation Simulator suite.

---
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | default(value=now()) | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        * {% if commit.scope %}**({{ commit.scope }})** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/ph-bar-recit/bar-recitation-simulator/commit/{{ commit.id }}))
    {% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features & New Capabilities" },
    { message = "^fix", group = "Bug Fixes & Engine Corrections" },
    { message = "^perf", group = "Performance & Optimization" },
    { message = "^docs", group = "Documentation & Guides" },
    { message = "^style", group = "UI/UX & Styling Polish" },
    { message = "^refactor", group = "Refactoring & Architecture" },
    { message = "^test", group = "Testing & Verification" },
    { message = ".*", group = "Other Engineering Updates" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"